*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Plex",Tahoma,"Segoe UI",sans-serif;font-size:17px;line-height:1.75;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding:0 18px 110px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px;min-height:58px}
.bar h1{font-size:17px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn.help{background:var(--honey);color:#3b2a00;font-weight:700;font-size:20px;box-shadow:none}
.iconbtn{border:0;background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
svg.i{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* الواجهة الأولى */
.hero{padding:26px 0 8px;display:flex;align-items:center;gap:16px}
.mark{position:relative;width:74px;height:74px;flex:none}
.mark span{position:absolute;inset:0;border-radius:50%;background:#FFE3B3}
.mark span:nth-child(2){inset:12px;background:#7FD8C8}
.mark span:nth-child(3){inset:24px;background:var(--sage)}
.brand{font-family:"Kufi","Plex",sans-serif;font-weight:600;font-size:46px;line-height:1.1;margin:0;color:var(--sage-2)}
.tag{margin:2px 0 0;color:var(--ink-2);font-size:15px}
.guidebtn{width:100%;border:0;display:flex;align-items:center;gap:14px;background:var(--honey-soft);border-radius:var(--radius-s);padding:12px 14px;cursor:pointer;text-align:start;margin-top:14px;box-shadow:inset 0 0 0 1.5px var(--honey)}
.guidebtn .q{width:44px;height:44px;border-radius:50%;background:var(--honey);color:#3b2a00;font-weight:700;font-size:24px;display:grid;place-items:center;flex:none}
.guidebtn b{display:block}.guidebtn small{color:var(--ink-2)}
.gstep{background:var(--surface);border-radius:var(--radius-l);padding:26px 20px;box-shadow:inset 0 0 0 1px var(--line);text-align:center;margin-top:8px}
.gstep .big-ic{margin:0 auto 14px}
.gstep h2{font-size:21px;margin:0 0 10px}
.gdots{display:flex;gap:8px;justify-content:center;margin:18px 0 0}
.gdots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.gdots i.on{background:var(--sage);width:24px;border-radius:9px}
.ask{font-size:24px;font-weight:600;margin:22px 0 4px;line-height:1.5}
.hint{color:var(--ink-2);margin:0 0 18px;font-size:15px}
.group{margin:22px 0 8px;font-size:15px;color:var(--gc,var(--ink-2));font-weight:600;display:flex;align-items:center;gap:8px}.group::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--gc,var(--sage))}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;text-align:start;background:var(--surface);border-radius:var(--radius-s);padding:14px 14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:92px;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .15s}
.tile:hover{box-shadow:inset 0 0 0 2px var(--sage)}
.tile .ic{color:var(--c,var(--sage));background:color-mix(in srgb,var(--c,var(--sage)) 14%,transparent);width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.tile b{font-weight:600;font-size:16px;line-height:1.4}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:64px}
.more{margin-top:28px;display:grid;gap:10px}
.row{border:0;width:100%;background:transparent;display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;text-align:start}
.row .ic{color:var(--sage)} .row span{flex:1} .row small{color:var(--ink-2)}
.calmrow{background:var(--lav);color:var(--lav-ink);border-radius:var(--radius-s);border:0;padding:14px}
.calmrow .ic{color:var(--lav-ink)}

/* الشاشات */
.lead{font-size:22px;font-weight:600;line-height:1.55;margin:10px 0 14px}
p{margin:0 0 12px}
.muted{color:var(--ink-2)}
.big-ic{width:72px;height:72px;border-radius:50%;background:color-mix(in srgb,var(--c,var(--sage)) 16%,transparent);display:grid;place-items:center;color:var(--c,var(--sage-2));margin:8px 0 6px}
.big-ic svg.i{width:34px;height:34px}
.signs{display:grid;gap:10px;margin-top:6px}
.sign{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:var(--radius-s);padding:14px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line);border:0;text-align:start;width:100%}
.sign .box{width:24px;height:24px;border-radius:7px;flex:none;margin-top:3px;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center}
.sign[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--sage);background:var(--sage-soft)}
.sign[aria-pressed="true"] .box{background:var(--sage);box-shadow:none}
.sign[aria-pressed="true"] .box svg{stroke:#fff}
.sign .box svg{width:16px;height:16px;stroke:transparent;fill:none;stroke-width:3}
.cta{position:fixed;bottom:0;left:0;right:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.cta .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:999px;padding:15px 18px;font-weight:600;font-size:17px;cursor:pointer;background:var(--sage);color:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);flex:none}

/* بطاقة الهدوء */
.calm{background:var(--lav);color:var(--lav-ink);border-radius:var(--radius-l);padding:30px 22px;text-align:center;margin-top:10px}
.breath{width:150px;height:150px;margin:6px auto 22px;position:relative}
.breath i{position:absolute;inset:0;border-radius:50%;background:var(--lav-ink);opacity:.12;animation:br 8s ease-in-out infinite}
.breath i:nth-child(2){inset:22px;opacity:.18;animation-delay:.3s}
.breath i:nth-child(3){inset:46px;opacity:.9;animation:none}
.breath b{position:absolute;inset:0;display:grid;place-items:center;color:var(--lav);font-weight:600;font-size:15px}
@keyframes br{0%,100%{transform:scale(.82)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){.breath i{animation:none}}
.calm p{font-size:19px;margin:0 0 8px}

/* الخطة */
.cause-name{font-size:21px;font-weight:600;margin:8px 0 6px;line-height:1.5}
.why{background:var(--surface);border-radius:var(--radius-s);padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line);margin-bottom:18px}
.why small{display:block;color:var(--sage-2);font-weight:600;font-size:14px;margin-bottom:2px}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps::before{content:"";position:absolute;inset-inline-start:15px;top:18px;bottom:18px;width:2px;background:var(--line)}
.step{position:relative;padding-inline-start:46px;margin-bottom:16px}
.step .dot{position:absolute;inset-inline-start:0;top:2px;width:32px;height:32px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--sage);display:grid;place-items:center;font-weight:600;color:var(--sage-2);font-size:15px}
.step.now .dot{background:var(--sage);color:#fff}
.step h3{margin:0 0 2px;font-size:16px;font-weight:600}
.step.now p{background:var(--honey-soft);border-radius:var(--radius-s);padding:10px 12px}
.note{border-radius:var(--radius-s);padding:12px 14px;margin:10px 0;display:flex;gap:10px;align-items:flex-start}
.note .ic{flex:none;margin-top:2px}
.note.tool{background:var(--sage-soft)} .note.tool .ic{color:var(--sage-2)}
.note.safe{background:var(--honey-soft)} .note.safe .ic{color:var(--honey)}
details{background:var(--surface);border-radius:var(--radius-s);box-shadow:inset 0 0 0 1px var(--line);padding:4px 14px;margin:10px 0}
summary{cursor:pointer;padding:10px 0;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chip{border:0;border-radius:999px;padding:7px 14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;font-size:15px}
.chip[aria-current="true"]{background:var(--sage);color:#fff;box-shadow:none}

/* المتابعة */
.plan{background:var(--surface);border-radius:var(--radius-l);padding:18px;box-shadow:inset 0 0 0 1px var(--line);margin-bottom:14px}
.plan h3{margin:0;font-size:17px} .plan .sub{color:var(--ink-2);font-size:14px;margin-bottom:12px}
.days{display:flex;gap:6px;margin:6px 0 14px}
.day{flex:1;height:34px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-size:13px;color:var(--ink-2)}
.day.b{background:var(--sage);color:#fff}.day.s{background:var(--sage-soft);color:var(--sage-2)}.day.w{background:var(--honey-soft);color:var(--ink)}
.rate{display:flex;gap:8px}
.rate button{flex:1;border:0;border-radius:var(--radius-s);padding:11px 6px;background:var(--bg);cursor:pointer;font-weight:600}
.rate button[aria-pressed="true"]{background:var(--sage);color:#fff}
textarea{width:100%;font:inherit;border:0;border-radius:var(--radius-s);padding:10px 12px;background:var(--bg);color:var(--ink);resize:vertical;min-height:70px;box-shadow:inset 0 0 0 1px var(--line)}
.result{margin-top:12px;padding:12px;border-radius:var(--radius-s);background:var(--honey-soft)}
.empty{text-align:center;padding:40px 10px;color:var(--ink-2)}
.sec h2{font-size:18px;margin:22px 0 4px;color:var(--sage-2)}
.print-list{display:grid;gap:10px;margin-top:10px}
.pl{display:flex;gap:12px;background:var(--surface);border-radius:var(--radius-s);padding:12px 14px;box-shadow:inset 0 0 0 1px var(--line)}
.pl .ic{color:var(--sage);flex:none;margin-top:2px}
.pl b{display:block;font-weight:600}
.pl span{color:var(--ink-2);font-size:15px}
.rate-row{background:var(--honey-soft);border-radius:var(--radius-s);border:0;padding:14px}.rate-row .ic{color:var(--honey)}
.credit{text-align:center;margin:34px 0 0;color:var(--ink-2);font-weight:600}.credit small{font-weight:400}
.q{background:var(--surface);border-radius:var(--radius-s);padding:16px;box-shadow:inset 0 0 0 1px var(--line);margin-bottom:12px}
.q h3{margin:0 0 10px;font-size:17px}.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{flex:1;min-width:90px;border:0;border-radius:var(--radius-s);padding:11px 6px;background:var(--bg);cursor:pointer;font-weight:600}
.opts button[aria-pressed="true"]{background:var(--sage);color:var(--on-sage)}
.dl{display:block;text-align:center;text-decoration:none;margin:14px 0}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const D = {"problems": [{"id": "c0", "key": "الصباح والخروج", "label": "الصباح والخروج", "sub": "الصباح معركة: لا يلبس، ولا يتحرك، ونتأخر", "group": "يوم طفلي", "icon": "sun", "intro": ["الطفل الصغير لا يشعر بالوقت كما نشعر به، وكلمة «بسرعة» لا تعني له شيئاً بعد.", "والبطء في الصباح له أسباب مختلفة، ولكل سبب حل مختلف."], "causes": [{"name": "لا يعرف الخطوة التالية", "sign": "يتوقف في منتصف اللبس، أو ينشغل بشيء آخر بين كل خطوة والتي بعدها.", "why": "الصباح فيه خطوات كثيرة متتالية، والطفل في هذا العمر لا يستطيع أن يتذكرها كلها وحده بالترتيب.", "before": "علّقي قرب سريره جدولاً من أربع صور بالترتيب: أستيقظ، أدخل الحمّام، ألبس، أفطر.", "during": "بدل أن تكرري الطلبات كلها، أشيري إلى الصورة واسأليه: «ماذا بعد في جدولك؟».", "after": "حين ينهي الجدول، دعيه يضع نجمة بيده على الصورة الأخيرة."}, {"name": "لم يأخذ كفايته من النوم", "sign": "يستيقظ بصعوبة، ويبكي أو يغضب من أول طلب، ويكون الصباح أسوأ بعد ليلة سهر.", "why": "يحتاج الطفل في هذا العمر بين عشر ساعات وثلاث عشرة ساعة نوم في اليوم. وإن نام أقل، يصبح بطيئاً وسريع الغضب في الصباح.", "before": "قدّمي موعد نومه تدريجياً، ربع ساعة كل بضعة أيام، حتى يستيقظ وهو مرتاح.", "during": "أيقظيه بهدوء، بفتح الستارة وصوت منخفض، وأعطيه دقائق قليلة قبل أول طلب.", "after": "إن تكرر هذا كثيراً، انتقلي إلى قسم النوم."}, {"name": "الوقت المتاح أقل مما يحتاجه", "sign": "الصباح يمر جيداً في أيام العطلة، ويتعثر في أيام الروضة والعمل.", "why": "نطلب منه في عشر دقائق ما يحتاج عشرين دقيقة على الأقل، لأن يديه ما زالتا تتعلمان اللبس والأزرار والحذاء.", "before": "جهّزي الملابس والحقيبة والحذاء في الليلة السابقة، وأيقظيه قبل ربع ساعة من المعتاد.", "during": "حوّلي اللبس إلى لعبة: «هل تستطيع أن تلبس قبل أن تنتهي هذه الأغنية؟».", "after": "امدحي ما فعله بالتحديد: «لبست القميص وحدك قبل أن تنتهي الأغنية!»."}, {"name": "شيء ممتع يشدّه بعيداً", "sign": "التلفاز أو الهاتف يعمل في الصباح، أو ألعابه أمامه وهو يلبس.", "why": "يصعب على الطفل أن يترك شيئاً ممتعاً ليقوم بشيء أقل متعة، مثل اللبس.", "before": "اجعلي الصباح بلا شاشات، وأبعدي الألعاب عن مكان اللبس.", "during": "استعملي «أولاً… ثم»: «أولاً نلبس، ثم تلعب خمس دقائق قبل الخروج».", "after": "إن جهز مبكراً، أعطيه الدقائق التي وعدته بها كاملة."}, {"name": "يريد أن يقرّر بنفسه", "sign": "يرفض كل ما تختارينه، ويقبل بسهولة حين يكون الاختيار منه.", "why": "كل شيء في الصباح يُفرض عليه، فيقاوم ليشعر أن له رأياً في يومه.", "before": "دعيه يختار ملابس الغد في الليل، من قطعتين تختارينهما أنتِ مسبقاً.", "during": "أعطيه خياراً صغيراً بين أمرين: «تلبس الجوارب أولاً أم القميص؟».", "after": "أعطيه مهمة يفتخر بها كل صباح، مثل حمل حقيبته بنفسه."}, {"name": "يقلق من المكان الذي سيذهب إليه", "sign": "يتباطأ أكثر في أيام الروضة تحديداً، أو يشكو من بطنه، أو يقول إنه لا يريد الذهاب.", "why": "أحياناً لا يكون البطء عناداً، بل محاولة لتأجيل شيء يقلقه.", "before": "تحدثي معه في الليل عن شيء محدد ينتظره غداً: صديق، أو لعبة، أو نشاط يحبه.", "during": "سمّي شعوره بهدوء: «أظن أنك قلق من الروضة اليوم. أنا أفهمك، وسأعود لآخذك».", "after": "إن تكرر هذا كل يوم، انتقلي إلى قسم الفراق."}], "tool": "جدول الصباح المصوّر بأربع خطوات، وبطاقة «أنا جاهز» تُعلَّق قرب الباب.", "expert": "إن تكرر رفض الخروج كل يوم مع خوف واضح، أو مع شكوى جسدية متكررة كألم البطن أو الغثيان.", "safety": ""}, {"id": "c1", "key": "الأكل", "label": "الأكل", "sub": "يأكل أصنافاً قليلة، أو يرفض الطعام، أو لا يأكل إلا أمام الشاشة", "group": "يوم طفلي", "icon": "bowl", "intro": ["رفض الطعام الجديد مرحلة طبيعية بين سنتين وست سنوات، وأغلب الأطفال يتجاوزونها.", "والضغط والإجبار يطيلانها ولا ينهيانها."], "causes": [{"name": "الطعام جديد عليه", "sign": "يرفض الصنف من النظرة الأولى، قبل أن يتذوقه.", "why": "الخوف من الطعام الجديد طبيعي في هذا العمر. ويحتاج الطفل أن يرى الطعام ويلمسه ويتذوقه مرات كثيرة قبل أن يقبله.", "before": "ضعي الصنف الجديد بكمية صغيرة جداً، بجانب صنف يحبه ويعرفه.", "during": "قولي له: «لا يلزم أن تأكله. يكفي أن تلمسه أو تشمّه».", "after": "قدّميه مرة أخرى بعد أيام، ثم مرة أخرى، دون تعليق ودون ضغط. القبول يأتي مع التكرار."}, {"name": "حساسية للملمس أو الرائحة", "sign": "يرفض أنواعاً بملمس معين، مثل اللزج أو المخلوط أو efore": "جهّزي النشاط التالي قبل الإطفاء، وضعيه أمامه.", "during": "خيّريه بين نشاطين: «تريد المكعبات أم الرسم؟».", "after": "العبي معه أول خمس دقائق فقط، ثم ابتعدي تدريجياً ليكمل وحده."}, {"name": "الشاشة صارت طريقته الوحيدة للهدوء", "sign": "يطلبها كلما ملّ أو حزن أو انتظر، أو تُعطى له لإيقاف بكائه.", "why": "إن كانت الشاشة هي ما يهدّئه في كل مرة، فلا يتعلم طريقة أخرى ليهدأ.", "before": "لا تعطيه الشاشة لإيقاف البكاء أو الملل. اجعلي لها وقتاً ثابتاً في اليوم.", "during": "حين يطلبها وهو منزعج: «أنت منزعج. تعال نهدأ معاً أولاً». ثم ضمّة، أو كوب ماء، أو تنفّس معاً.", "after": "جهّزي معه «صندوق الهدوء»: كتاب، ومعجون، وكرة طرية. يلجأ إليه بدل الشاشة."}, {"name": "لا توجد قاعدة واضحة", "sign": "لا يوجد وقت محدد للشاشة، والجهاز متاح متى طلبه.", "why": "الأطفال الذين ليس لدى أسرهم قواعد واضحة للشاشة يقضون أمامها وقتاً أطول.", "before": "ضعي قاعدة بثلاثة أجزاء: متى، وأين، وكم. مثلاً: بعد العصر، في الصالة، مدة حلقتين.", "during": "إذا طلبها في غير وقتها: «الشاشة بعد العصر. الآن نلعب بالمكعبات».", "after": "أبقي الأجهزة بعيدة عن نظره خارج وقتها، ولا تضعيها في غرفة نومه. وحين يشاهد، اجلسي معه أحياناً واسأليه عما يرى، فالمشاهدة المشتركة أنفع له."}, {"name": "التلفاز يعمل في البيت طوال الوقت", "sign": "التلفاز مفتوح في الخلفية حتى لو لم يشاهده أحد، أو يعمل أثناء الوجبات.", "why": "التلفاز المفتوح في الخلفية يقطع لعب الطفل وكلامه مع من حوله، ويزيد مدة مشاهدته دون أن ننتبه.", "before": "أطفئي التلفاز حين لا يشاهده أحد، ولا تشغليه أثناء الوجبات.", "during": "إن أراد أحد الكبار المشاهدة، فليكن في غرفة أخرى أو بعد نوم الطفل.", "after": "اتفقي على هذه القاعدة مع كل من يعيش في البيت."}, {"name": "يرى الكبار على الهواتف كثيراً", "sign": "الهاتف في يد الكبار في أغلب الوقت الذي يقضونه معه.", "why": "الطفل يقلد ما يراه. وانشغال الكبار بالهاتف يقلل كلامهم ولعبهم معه، فيطلب الشاشة هو أيضاً.", "before": "اختاري أوقاتاً بلا هواتف للجميع: الوجبات، وربع ساعة لعب يومياً، وقبل النوم.", "during": "إن طلب الهاتف وهو يراك عليه: «أنهي هذه الرسالة، ثم أضعه بعيداً ونلعب».", "after": "ضعي هاتفك بعيداً فعلاً حين تكونين معه، فهذا أقوى من أي كلام."}], "tool": "مؤقت مصوّر، وبطاقة «أولاً… ثم»، وبطاقة «إلى اللقاء غداً» تُعلَّق قرب الجهاز.", "expert": "إن رفض كل نشاط غير الشاشة، أو تأخر كلامه عن أقرانه، أو صار يؤذي نفسه أو غيره عند كل إطفاء.", "safety": ""}, {"id": "c3", "key": "النوم", "label": "النوم", "sub": "لا يريد أن ينام، أو يستيقظ ليلاً ويأتي إلى سريري", "group": "يوم طفلي", "icon": "moon", "intro": ["مشكلات النوم شائعة جداً في هذا العمر، وأغلبها يتحسّن بتغيير العادات.", "يحتاج الطفل بين عشر ساعات وثلاث عشرة ساعة نوم في اليوم، مع القيلولة إن وُجدت."], "causes": [{"name": "لا يوجد روتين ثابت", "sign": "وقت النوم يتغير من ليلة إلى أخرى، وما قبله يختلف كل مرة.", "why": "حين يتغيّر وقت النوم وما قبله كل يوم، لا يستعد جسمه للنوم.", "before": "وقت نوم ثابت كل ليلة، وروتين قصير بالترتيب نفسه: حمّام، ملابس النوم، الأسنان، قصة.", "during": "أشيري إلى جدول النوم المصوّر: «الآن القصة، ثم نطفئ الضوء».", "after": "اجعلي الروتين بين عشرين وثلاثين دقيقة، وثبّتي وقت الاستيقاظ صباحاً حتى في العطلة."}, {"name": "القيلولة متأخرة أو طويلة", "sign": "ينام بعد العصر أو قرب المغرب، ثم لا ينعس إلا في وقت متأخر ليلاً.", "why": "النوم في آخر النهار يقلل حاجة جسمه للنوم في الليل. ويحتاج أغلب الأطفال خمس إلى ست ساعات يقظة بين القيلولة ووقت النوم.", "before": "قدّمي القيلولة إلى بداية فترة الظهر، وقصّريها إلى ساعة أو ساعة ونصف.", "during": "إن نام متأخراً في يوم ما، أيقظيه بلطف بعد مدة قصيرة.", "after": "بعد الثالثة يستغني بعض الأطفال عن القيلولة، فيصبح نومهم في الليل أبكر وأسهل."}, {"name": "موعد النوم أبكر من نعاسه الحقيقي", "sign": "يبقى في سريره ساعة أو أكثر قبل أن ينام، مهما فعلتِ.", "why": "إن وُضع في السرير قبل أن ينعس جسمه فعلاً، يتحول السرير إلى مكان للمقاومة والجدال.", "before": "ابدئي بالموعد الذي ينام فيه فعلاً الآن، حتى لو كان متأخراً، ثم قدّميه ربع ساعة كل بضعة أيام.", "during": "حين يذهب إلى السرير وهو نعسان حقاً، ينام بسرعة وبلا معركة.", "after": "استمري في التقديم التدريجي حتى تصلي إلى الموعد المناسب."}, {"name": "الغرفة أو المشروبات تمنع النعاس", "sign": "غرفته مضيئة أو صاخبة أو حارة، أو يشرب الشاي أو المشروبات الغازية، أو يأكل الشوكولاتة في المساء.", "why": "الضوء والضجيج والحرارة تؤخر النوم. والشاي والمشروبات الغازية والشوكولاتة فيها منبّه يبقى في الجسم ساعات.", "before": "غرفة مظلمة وهادئة ومعتدلة الحرارة. ولا شاي ولا مشروبات غازية ولا شوكولاتة بعد العصر.", "during": "إن كان يخاف الظلام، ضوء خافت جداً بعيد عن عينيه، لا ضوء الغرفة كله.", "after": "لاحظي الفرق بعد أسبوع من التغيير."}, {"name": "الشاشة أو اللعب الحماسي قبل النوم", "sign": "يشاهد الشاشة أو يلعب ألعاباً صاخبة في الساعة الأخيرة قبل النوم.", "why": "الضوء والإثارة يؤخران النعاس، ويجعلان النوم أخف وأقصر.", "before": "أطفئي الشاشات قبل النوم بساعة على الأقل.", "during": "في الساعة الأخيرة: ألعاب هادئة، وضوء خافت، وصوت منخفض في البيت.", "after": "إن لم ينم سريعاً، فالبديل قصة هادئة، لا الشاشة."}, {"name": "تعوّد أن ينام وأنتِ بجانبه", "sign": "لا ينام إلا وأنتِ معه، ويستيقظ ليلاً ويبحث عنك أو يأتي إلى سريرك.", "why": "إن نام وأنتِ معه، فحين يستيقظ ليلاً، وهذا طبيعي عند كل الأطفال، يحتاجك لكي يعود إلى النوم.", "before": "قبّليه واخرجي وهو نعسان لا نائم. ويمكنك الابتعاد تدريجياً على أيام: بجانب السرير، ثم في منتصف الغرفة، ثم عند الباب.", "during": "إن نادى أو جاء، أعيديه إلى سريره بهدوء وبأقل كلام: «وقت النوم. أنا قريبة».", "after": "في الصباح امدحي ما نجح فيه، ولو كان قليلاً."}, {"name": "يخاف من الظلام أو من الوحدة", "sign": "يطلب أن تبقي معه، أو يقول إنه يخاف، أو يستيقظ بعد حلم مزعج.", "why": "الخيال في هذا العمر واسع جداً، والمخاوف الليلية شائعة وحقيقية عنده. وتجاهلها قد يزيدها.", "before": "ضوء خافت في الغرفة، ولعبة يحبها ينام معها، وتجنب القصص والمشاهد المخيفة في المساء.", "during": "«أعرف أنك خائف. أنت في أمان، وأنا قريبة». ثم اخرجي بهدوء.", "after": "يمكنك أن تمري عليه بعد دقائق قصيرة لتطمئنيه، ثم تطيلين المدة بين المرات تدريجياً."}, {"name": "الطلبات لا تنتهي بعد إطفاء الضوء", "sign": "ماء، ثم حضن، ثم الحمّام، ثم سؤال… وكل طلب يطيل السهر.", "why": "كل طلب يُستجاب له يطيل الوقت قبل النوم، ويعلّمه أن الطلبات تنجح.", "before": "أنهي كل الطلبات داخل الروتين: الماء، والحمّام، والحضن الأخير. ثم أعطيه «بطاقة السماح».", "during": "يستعمل البطاقة مرة واحدة فقط. وبعدها: «انتهى وقت الطلبات. تصبح على خير».", "after": "في الصباح امدحيه إن احتفظ بالبطاقة أو نام دون نداء."}], "tool": "جدول النوم المصوّر، و«بطاقة السماح» التي يستعملها مرة واحدة كل ليلة لطلب ماء أو حضن.", "expert": "إن كان يشخر بصوت عالٍ أو يتوقف نفسه أثناء النوم، أو بقي نعساناً في النهار رغم نومه، أو كانت الكوابيس والفزع الليلي شديدة ومتكررة.", "safety": ""}, {"id": "c4", "key": "الحمّام", "label": "الحمّام", "sub": "التدريب متعثر، أو يرفض الجلوس على المرحاض", "group": "يوم طفلي", "icon": "drop", "intro": ["الاستعداد للتدريب يعتمد على نمو الطفل لا على عمره وحده. وأغلب المهارات اللازمة تبدأ نحو السنتين وتكتمل نحو الثالثة.", "والتحكم في الليل يتأخر عادة عن النهار، وقد يستمر البلل الليلي طبيعياً حتى الخامسة."], "causes": [{"name": "لم يستعد بعد", "sign": "لا يبقى جافاً ساعتين، ولا يخبرك أنه تبلّل أو أنه يريد الحمّام، ولا يهتم بالأمر.", "why": "البدء قبل الاستعداد يطيل مدة التدريب ولا يقصرها، ويحوّله إلى صراع.", "before": "انتظري ظهور علامتين أو ثلاث: يبقى جافاً ساعتين، ويخبرك بالبلل، ويهتم بالحمّام، ويفهم طلباً بسيطاً. وعند البدء خصّصي نحو أسبوعين في البيت، دون سفر أو مناسبات كبيرة.", "during": "إن رفض بشدة بعد البدء، توقفي بضعة أسابيع، ثم أعيدي المحاولة دون تعليق.", "after": "لا تحددي موعداً للبدء بسبب ضغط الأقارب أو موعد الروضة وحده."}, {"name": "الفرق الطبيعي بين البنات والأولاد", "sign": "تقارنين ابنك بأخته، أو بابنة قريبة في عمره، فتشعرين أنه متأخر.", "why": "البنات يتدربن في المتوسط قبل الأولاد بثلاثة إلى خمسة أشهر. هذا فرق طبيعي، وليس تأخراً.", "before": "قارني تقدمه بنفسه، لا بفتاة في عمره.", "during": "مع الأولاد: يمكن البدء بالجلوس للتبول والتبرز معاً، ثم تعلّم الوقوف لاحقاً.", "after": "امدحي كل خطوة صغيرة: الجلوس، والإخبار، والمحاولة."}, {"name": "جدول التدريب غير منتظم", "sign": "يُجلَس على المرحاض أحياناً ويُنسى أحياناً، أو يختلف الأسلوب بين البيت والحضانة والجدة.", "why": "الجسم يتعلم بالتكرار في أوقات ثابتة. وحين تتغير المواعيد والقواعد من يوم إلى يوم، يتأخر التعلم.", "before": "أوقات ثابتة للجلوس كل يوم: بعد الاستيقاظ، وبعد كل وجبة بربع ساعة تقريباً، وقبل الخروج، وقبل النوم.", "during": "«حان وقت الحمّام. نجلس قليلاً». من ثلاث إلى خمس دقائق تكفي، ولا داعي للجلوس الطويل.", "after": "اتفقي مع كل من يرعاه على المواعيد نفسها والكلمات نفسها."}, {"name": "كمية السوائل وطريقة شربها", "sign": "يشرب كوباً كبيراً دفعة واحدة، أو يشرب الشاي أو المشروبات الغازية أو العصير كثيراً، فتكثر الحوادث بعدها.", "why": "الكمية الكبيرة في وقت قصير تملأ المثانة فجأة، فلا يلحق بالحمّام. والشاي والمشروبات الغازية تزيد الحاجة إلى التبول.", "before": "وزّعي الماء على اليوم في أكواب صغيرة، وتجنبي الشاي والمشروبات الغازية. واجعلي آخر شرب قبل النوم بساعة ونصف تقريباً، وآخر ما يفعله قبل النوم دخول الحمّام.", "during": "بعد أن يشرب كمية جيدة، ذكّريه بالحمّام بعد نصف ساعة تقريباً.", "after": "لا تمنعي الماء عنه في النهار، فقلة الماء تسبب الإمساك، والإمساك يعطّل التدريب."}, {"name": "الإمساك أو الخوف من الألم", "sign": "برازه قاسٍ أو مؤلم، أو يختبئ ويحبس، أو يرفض الجلوس للتبرز خاصة.", "why": "الإمساك من أكبر عوائق التدريب. والطفل الذي تألم مرة يحبس خوفاً من الألم، فيزداد الإمساك.", "before": "طعام فيه ألياف من الخضار والفواكه والبقول، وماء كافٍ، ومسند للقدمين ليجلس مرتاحاً.", "during": "«أنا معك. نجلس قليلاً فقط». ولا تضغطي عليه ليخرج شيئاً.", "after": "إن استمر الإمساك، راجعي الطبيب قبل متابعة التدريب."}, {"name": "يخاف من المرحاض نفسه", "sign": "يبكي عند الاقتراب منه، أو يخاف صوت السيفون، أو يمسك بك خوفاً من السقوط.", "why": "المقعد الكبير والفتحة الواسعة والصوت المفاجئ أشياء مخيفة لطفل صغير.", "before": "استعملي مقعداً صغيراً فوق المرحاض أو نونية على الأرض، ومسنداً للقدمين.", "during": "دعيه يجلس بملابسه في البداية ليعتاد المكان، ثم دون ملابس.", "after": "اشدّي السيفون أنتِ بعد أن يخرج من الحمّام إن كان يخاف صوته."}, {"name": "الخوف من التوبيخ عند البلل", "sign": "يخفي البلل، أو يختبئ حين يحتاج، أو ينكر حين تسألينه.", "why": "التوبيخ أو السخرية أو المقارنة عند البلل تجعل الطفل يربط الحمّام بالخجل، فيخفي حاجته بدل أن يخبرك بها.", "before": "اتفقي مع الأسرة: لا توبيخ، ولا سخرية، ولا حكاية الحادثة أمام الآخرين.", "during": "«لا بأس. البول مكانه الحمّام». ثم نظّفا معاً بهدوء، دون كلام كثير.", "after": "امدحي كل مرة يخبرك فيها، حتى لو جاء متأخراً."}, {"name": "تغيير كبير في حياته", "sign": "كان متدرباً، ثم عاد يتبلل بعد ولادة أخ، أو انتقال، أو بداية الروضة.", "why": "التغييرات الكبيرة ترجع الطفل أحياناً خطوة إلى الوراء، وهذا مؤقت غالباً.", "before": "لا تبدئي التدريب في وقت تغيير كبير، وأجّليه حتى يستقر.", "during": "تعاملي مع الحوادث بهدوء، كأنها أمر عادي.", "after": "يعود الطفل غالباً إلى ما كان عليه خلال أسابيع، مع الهدوء والروتين."}], "tool": "جدول الحمّام المصوّر: أجلس، أمسح، أشد السيفون، أغسل يدي. ولوحة نجوم للمحاولة.", "expert": "إن تألّم عند التبوّل أو التبرّز، أو استمر الإمساك، أو عاد يتبلّل بعد أشهر من الجفاف دون سبب واضح، أو لم يتدرّب نهاراً بعد الخامسة.", "safety": ""}, {"id": "c5", "key": "نوبات الغضب", "label": "نوبات الغضب", "sub": "يصرخ ويبكي ويرمي نفسه", "group": "سلوكه", "icon": "cloud", "intro": ["النوبة جزء طبيعي من النمو بين سنتين وخمس سنوات، وأشدّها في السنة الثالثة.", "طفلك لا يتعمّد إزعاجك. هو لا يملك بعدُ طريقة أخرى للتعبير عن مشاعره القوية."], "causes": [{"name": "جائع أو متعب", "sign": "النوبات تكثر قبل الأكل، أو آخر النهار، أو بعد يوم طويل.", "why": "الجوع والتعب والمرض تجعل احتمال الطفل أقل بكثير.", "before": "وجبة خفيفة قبل الخروج، ونوم في وقت ثابت. ولا تطلبي منه أمراً صعباً في ساعة تعبه.", "during": "لا تشرحي ولا تحاوري. قولي فقط: «أنت متعب. أنا معك». وخفّفي الكلام والضوء والصوت.", "after": "أطعميه أو أريحيه أولاً. والكلام بعد ذلك إن لزم."}, {"name": "لا يجد الكلمات", "sign": "يحاول أن يقول شيئاً أو يفعل شيئاً، ثم ينفجر حين لا يُفهم أو لا ينجح.", "why": "يريد شيئاً، ولا يعرف كيف يقوله أو كيف يفعله، فيخرج إحباطه صراخاً.", "before": "علّميه كلمات المشاعر في أوقات الهدوء: غاضب، حزين، تعبت، ساعديني.", "during": "سمّي شعوره عنه: «أنت غاضب لأن البرج وقع». ثم أعطيه الكلمة: «قل: ساعديني».", "after": "كلما طلب بالكلام، استجيبي بسرعة وامدحي: «طلبت بالكلام، فساعدتك فوراً»."}, {"name": "الانتقال المفاجئ const COL={sun:'#F29A2E',bowl:'#EF6F45',screen:'#2F86D6',moon:'#6A5CD8',drop:'#1FA3B8',cloud:'#E1566E',ear:'#D99A1E',hands:'#D35F95',run:'#2FA864',door:'#8B5CD6'};
const GCOL={'يوم طفلي':'#F29A2E','سلوكه':'#E1566E','مشاعره':'#8B5CD6'};
const ic = (n,c='i') => `<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem('rifq.v1')) || {plans:{}}; }catch(e){ return {plans:{}}; } },
  set(v){ try{ localStorage.setItem('rifq.v1', JSON.stringify(v)); }catch(e){} }
};
let S = { view:'home', stack:[], p:null, sel:[], ci:0 };
const app = document.getElementById('app');
function go(view, extra={}){ S.stack.push({view:S.view,p:S.p,sel:S.sel.slice(),ci:S.ci}); Object.assign(S,{view},extra); render(); window.scrollTo(0,0); }
function back(){ const s=S.stack.pop(); if(!s){ S.view='home'; } else Object.assign(S,s); render(); window.scrollTo(0,0); }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1800); }
const P = id => D.problems.find(x=>x.id===id);
const bar = t => `<div class="bar"><button class="iconbtn" onclick="back()" aria-label="رجوع">${ic('back')}</button><h1>${esc(t)}</h1><button class="iconbtn" onclick="goHome()" aria-label="الصفحة الأولى">${ic('home')}</button><button class="iconbtn help" onclick="go('guide',{gi:0})" aria-label="كيف أستخدم رِفق؟">؟</button></div>`;
function goHome(){ S.stack=[]; S.view='home'; render(); scrollTo(0,0); }
const cta = inner => `<div class="cta"><div class="in">${inner}</div></div>`;

function home(){
  const groups = ['يوم طفلي','سلوكه','مشاعره'];
  const st = store.get(); const active = Object.keys(st.plans).length;
  let h = `<header class="hero"><div class="mark" aria-hidden="true"><span></span><span></span><span></span></div>
  <div><p class="brand">رِفق</p><p class="tag">لأيامٍ أهدأ مع طفلك الصغير</p></div></header>
  <button class="guidebtn" onclick="go('guide',{gi:0})"><span class="q">؟</span><span><b>كيف أستخدم رِفق؟</b><small>دليل قصير في ست خطوات</small></span></button>
  <p class="ask">ما الذي يُتعبكِ اليوم؟</p><p class="hint">اختاري، واعرفي السبب، وجرّبي الحل أسبوعاً.</p>`;
  for(const g of groups){
    const items = D.problems.filter(p=>p.group===g);
    h += `<p class="group" style="--gc:${GCOL[g]}">${g}</p><div class="tiles">` + items.map(p=>`<button class="tile${items.length===1?' wide':''}" style="--c:${COL[p.icon]}" onclick="go('intro',{p:'${p.id}',sel:[],ci:0})"><span class="ic">${ic(p.icon)}</span><b>${esc(p.label)}</b></button>`).join('') + `</div>`;
  }
  h += `<div class="more">
   <button class="row calmrow" onclick="go('care')"><span class="ic">${ic('leaf')}</span><span><b>هدوؤكِ أولاً</b><br><small style="color:inherit">لكِ أنتِ، قبل أي حل</small></span></button>
   <button class="row" onclick="go('track')"><span class="ic">${ic('chart')}</span><span>متابعتي${active?` <small>(${active})</small>`:''}</span></button>
   <button class="row" onclick="go('timeout')"><span class="ic">${ic('clock')}</span><span>وقت الهدوء، من عمر ثلاث سنوات</span></button>
   <button class="row" onclick="go('prints')"><span class="ic">${ic('print')}</span><span>أدوات للطباعة</span></button>
   <button class="row rate-row" onclick="go('feedback')"><span class="ic">${ic('star')}</span><span><b>قيّمي رِفق</b><br><small>خمسة أسئلة قصيرة</small></span></button>
  </div>
  <p class="credit">إعداد: د. عبير جفال<br><small>مسار</small></p>`;
  return h;
}
function intro(){
  const p=P(S.p);
  return bar(p.label) + `<div class="big-ic" style="--c:${COL[p.icon]}">${ic(p.icon)}</div><p class="lead">${esc(p.sub)}</p>` + p.intro.map(t=>`<p>${esc(t)}</p>`).join('')
   + cta(`<button class="btn" onclick="go('signs')">لماذا يحدث؟</button>`);
}
function signs(){
  const p=P(S.p);
  return bar(p.label) + `<p class="lead">ماذا ترين في طفلك؟</p><p class="muted">اختاري كل ما يشبهه. سنبدأ بالأول، ونحتفظ بالباقي.</p>
  <div class="signs">` + p.causes.map((c,i)=>`<button class="sign" aria-pressed="${S.sel.includes(i)}" onclick="tog(${i})"><span class="box"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>${esc(c.sign)}</span></button>`).join('') + `</div>`
   + cta(`<button class="btn" ${S.sel.length?'':'disabled'} onclick="go('calm',{ci:0})">أكملي</button>`);
}
function tog(i){ const k=S.sel.indexOf(i); k>-1?S.sel.splice(k,1):S.sel.push(i); render(); }
function calm(){
  return bar('هدوؤكِ أولاً') + `<div class="calm"><div class="breath" aria-hidden="true"><i></i><i></i><i></i><b>تنفّسي</b></div>` + D.calm.map(t=>`<p>${esc(t)}</p>`).join('') + `</div>`
   + cta(`<button class="btn" onclick="go('plan')">أنا مستعدة</button>`);
}
function plan(){
  const p=P(S.p); const idx=S.sel[S.ci]; const c=p.causes[idx];
  let h = bar(p.label);
  if(S.sel.length>1) h += `<div class="chips">` + S.sel.map((k,j)=>`<button class="chip" aria-current="${j===S.ci}" onclick="S.ci=${j};render();scrollTo(0,0)">${esc(p.causes[k].name)}</button>`).join('') + `</div>`;
  h += `<p class="cause-name">${esc(c.name)}</p><div class="why"><small>لماذا يحدث</small>${esc(c.why)}</div>
  <ol class="steps">
   <li class="step"><span class="dot">١</span><h3>قبل الموقف</h3><p>${esc(c.before)}</p></li>
   <li class="step now"><span class="dot">٢</span><h3>في اللحظة نفسها</h3><p>${esc(c.during)}</p></li>
   <li class="step"><span class="dot">٣</span><h3>بعد الموقف</h3><p>${esc(c.after)}</p></li>
  </ol>`;
  if(p.safety) h += `<div class="note safe"><span class="ic">${ic('alert')}</span><span>${esc(p.safety)}</span></div>`;
  h += `<div class="note tool"><span class="ic">${ic('tool')}</span><span><b>أداة لطفلك:</b> ${esc(p.tool)}</span></div>
  <details><summary>متى تستشيرين مختصاً؟</summary><p>${esc(p.expert)}</p></details>`;
  const st=store.get(); const key=S.p+':'+idx; const on=!!st.plans[key];
  return h + cta(on?`<button class="btn" onclick="go('track')">افتحي متابعتي</button>`:`<button class="btn" onclick="startPlan()">ابدئي أسبوع المتابعة</button>`);
}
function startPlan(){
  const st=store.get(); const idx=S.sel[S.ci]; const key=S.p+':'+idx;
  st.plans[key]={p:S.p,c:idx,rest:S.sel.filter(k=>k!==idx),start:new Date().toISOString().slice(0,10),days:{},wins:{}};
  store.set(st); toast('بدأ أسبوع المتابعة'); go('track');
}
const today=()=>new Date().toISOString().slice(0,10);
function dayIndex(start){ return Math.floor((new Date(today())-new Date(start))/86400000); }
function rate(key,v){ const st=store.get(); st.plans[key].days[today()]=v; store.set(st); render(); }
function win(key,el){ const st=store.get(); st.plans[key].wins[today()]=el.value; store.set(st); }
function endPlan(key){ const st=store.get(); delete st.plans[key]; store.set(st); render(); }
function nextCause(key){ const st=store.get(); const pl=st.plans[key]; const nxt=pl.rest[0]; delete st.plans[key]; store.set(st);
  S.p=pl.p; S.sel=[nxt].concat(pl.rest.slice(1)); S.ci=0; go('plan'); }
function track(){
  const st=store.get(); const keys=Object.keys(st.plans);
  let h = bar('متابعتي');
  if(!keys.length) return h + `<div class="empty">${ic('chart')}<p>لا توجد متابعة بعد.</p><p>اختاري تحدياً من الصفحة الأولى، ثم ابدئي أسبوع المتابعة.</p></div>`;
  h += `<p class="muted">ضغطة واحدة كل يوم. قد يزداد السلوك قليلاً في الأيام الأولى قبل أن يتحسّن، فهذه علامة أن طفلك لاحظ التغيير. اثبتي على الخطة.</p>`;
  for(const key of keys){
    const pl=st.plans[key]; const p=P(pl.p); const c=p.causes[pl.c];
    const d0=new Date(pl.start); let dots='', vals=[];
    for(let i=0;i<7;i++){ const d=new Date(d0.getTime()+i*86400000).toISOString().slice(0,10); const v=pl.days[d]; if(v) vals.push(v);
      dots+=`<span class="day ${v==='better'?'b':v==='same'?'s':v==='worse'?'w':''}">${['١','٢','٣','٤','٥','٦','٧'][i]}</span>`; }
    const di=dayIndex(pl.start); const cur=pl.days[today()];
    h += `<div class="plan"><h3>${esc(p.label)}</h3><div class="sub">${esc(c.name)}</div><div class="days">${dots}</div>`;
    if(di<7){
      h += `<p style="margin-bottom:8px">كيف كان اليوم مقارنة بالأمس؟</p><div class="rate">
       <button aria-pressed="${cur==='better'}" onclick="rate('${key}','better')">أفضل</button>
       <button aria-pressed="${cur==='same'}" onclick="rate('${key}','same')">مثل أمس</button>
       <button aria-pressed="${cur==='worse'}" onclick="rate('${key}','worse')">أسوأ</button></div>
       <p style="margin:14px 0 6px">نجاح اليوم، ولو كان صغيراً:</p><textarea oninput="win('${key}',this)" placeholder="مثال: لبس حذاءه بعد طلب واحد">${esc(pl.wins[today()]||'')}</textarea>`;
    } else {
      const b=vals.filter(v=>v==='better').length;
      if(b>=3) h += `<div class="result">تحسّن طفلك في ${b} أيام. استمري على الخطة نفسها.</div>`;
      else h += `<div class="result">لم يظهر تحسّن واضح بعد أسبوع. جرّبي السبب التالي الذي اخترتِه.</div>`;
      if(pl.rest.length) h += `<div class="rate" style="margin-top:10px"><button onclick="nextCause('${key}')">السبب التالي</button><button onclick="endPlan('${key}')">إنهاء</button></div>`;
      else h += `<div class="rate" style="margin-top:10px"><button onclick="endPlan('${key}')">إنهاء المتابعة</button></div>`;
    }
    h += `</div>`;
  }
  h += `<div class="note tool"><span class="ic">${ic('heart')}</span><span>اتفقي مع كل من يرعى طفلك على العبارة نفسها والقاعدة نفسها، فالاختلاف بين الكبار يُفشل أي خطة.</span></div>`;
  return h;
}
function care(){
  return bar('هدوؤكِ أولاً') + `<div class="calm" style="padding:22px"><div class="breath" style="width:110px;height:110px;margin-bottom:12px" aria-hidden="true"><i></i><i></i><i></i></div><p>أنتِ أهم أداة في هذا كله.</p></div>`
   + `<div class="sec">` + D.care.map(([a,b])=>`<h2>${esc(a)}</h2><p>${esc(b)}</p>`).join('') + `</div>`;
}
function timeout(){
  return bar('وقت الهدوء') + `<p class="lead">دقائق قليلة يهدأ فيها طفلك، ثم يعود</p><p>وقت الهدوء ليس عقاباً. هو أن يجلس طفلك في مكان هادئ دقائق قليلة حتى يهدأ، ثم يعود إلى ما كان يفعله. يناسب الأطفال من عمر ثلاث سنوات.</p><div class="sec">` + D.timeout.map(([a,b])=>`<h2>${esc(a)}</h2><p>${esc(b)}</p>`).join('')
   + `<h2>التجاهل المخطط</h2><p>مع التذمّر والنوبات التي هدفها جلب الانتباه: لا نظر طويل ولا كلام عن السلوك، مع البقاء قريبة للسلامة، ثم انتباه كامل ومديح فور أن يهدأ.</p></div>`;
}
const PRINTS = [
 ['sun','جدول الصباح','أربع خطوات مصوّرة تُعلَّق قرب السرير.'],['moon','جدول النوم وبطاقة السماح','روتين النوم بالصور، وبطاقة يستعملها طفلك مرة كل ليلة.'],
 ['drop','جدول الحمّام وسجله','خطوات الحمّام، وسجل أسبوعي لمواعيد الجلوس والنجاح.'],['star','لوحة النجوم الأسبوعية','لسلوك واحد تختارينه، لسبعة أيام.'],
 ['tool','بطاقة «أولاً… ثم»','خانتان: الطلب، ثم ما يحبه طفلك.'],['cloud','بطاقة المشاعر وبطاقة «أنا أهدأ»','أربعة وجوه يشير إليها، وثلاث طرق ليهدأ.'],
 ['heart','قواعد بيتنا','ثلاث قواعد فقط، بصور واضحة.'],['chart','مخطط يوم طفلي','يوم كامل بالصور: نشاط، وطعام، ولعب، ونوم.'],
 ['bowl','لوحة مستكشف الطعام','يلوّن صورة كل صنف جديد تعرّف عليه.'],['door','بطاقة «أعود بعد…»','يربط بها طفلك عودتك بحدث يعرفه.'],
 ['screen','خطة الشاشة','متى، وأين، وكم، مع بطاقة «إلى اللقاء غداً».'],['hands','اتفاق الرعاية','تعطينه للجدة أو المربية لتوحيد العبارة والقاعدة.'],
 ['chart','سجل المتابعة الأسبوعي','نسخة ورقية من متابعة الأيام السبعة ونجاح كل يوم.']
];
function prints(){
  return bar('أدوات للطباعة') + `<p class="muted">كل هذه الأدوات في ملف واحد. حمّليه واطبعي ما تحتاجينه فقط.</p><a class="btn dl" href="rifq_tools.pdf" download>حمّلي ملف الأدوات</a><div class="print-list">`

}
const GUIDE=[
 ['heart','#11897B','أهلاً بكِ في رِفق','رِفق يساعدكِ على فهم سبب ما يفعله طفلك، ويعطيكِ خطوات بسيطة تجرّبينها أسبوعاً. كل شيء يأخذ أقل من دقيقتين.'],
 ['sun','#F29A2E','اختاري ما يُتعبكِ','في الصفحة الأولى اضغطي على التحدي الذي تريدين حلّه اليوم، مثل النوم أو الشاشة أو نوبات الغضب.'],
 ['ear','#E1566E','اختاري ما يشبه طفلك','تظهر لكِ جمل قصيرة تصف ما يحدث. اضغطي على كل جملة تشبه طفلك، ثم اضغطي «أكملي».'],
 ['leaf','#5A3DC8','تنفّسي، ثم اقرئي الخطة','قبل كل حل تظهر بطاقة هدوء قصيرة. بعدها تجدين ثلاث خطوات: قبل الموقف، وفي اللحظة نفسها، وبعده.'],
 ['chart','#2F86D6','تابعي أسبوعاً','اضغطي «ابدئي أسبوع المتابعة». وكل يوم افتحي «متابعتي» واضغطي ضغطة واحدة: أفضل، أو مثل أمس، أو أسوأ.'],
 ['home','#2FA864','التنقل وحفظ المعلومات','زر السهم يرجعكِ خطوة، وزر البيت يعيدكِ إلى الصفحة الأولى، وزر علامة السؤال يفتح هذا الدليل. متابعتكِ تُحفظ تلقائياً على هذا الهاتف وفي هذا المتصفح، دون حساب أو تسجيل. لا تمسحي بيانات المتصفح كي لا تضيع.']

function guide(){
  const g=GUIDE[S.gi||0], last=(S.gi||0)===GUIDE.length-1;
  return bar('كيف أستخدم رِفق؟') + `<div class="gstep"><div class="big-ic" style="--c:${g[1]}">${ic(g[0])}</div><h2>${g[2]}</h2><p>${g[3]}</p>
   <div class="gdots">${GUIDE.map((_,i)=>`<i class="${i===(S.gi||0)?'on':''}"></i>`).join('')}</div></div>`
   + cta(`${(S.gi||0)>0?`<button class="btn ghost" onclick="S.gi--;render()">السابق</button>`:''}<button class="btn" onclick="${last?"seen();goHome()":"S.gi++;render()"}">${last?'ابدئي الآن':'التالي'}</button>`);
}
function seen(){ try{ localStorage.setItem('rifq.guide','1'); }catch(e){} }
const FQ=[
 ['هل كان استخدام التطبيق سهلاً؟',['سهل جداً','سهل','صعب']],
 ['هل كانت اللغة واضحة؟',['واضحة جداً','مقبولة','غير واضحة']],
 ['هل أعجبك الشكل والألوان؟',['نعم كثيراً','إلى حدٍّ ما','لا']],
 ['هل تتوقعين أن تفيدك الحلول مع طفلك؟',['نعم','ربما','لا']]
];
let FA={}, FT='', FS='';
function feedback(){
  if(FS==='done') return bar('قيّمي رِفق') + `<div class="empty">${ic('heart')}<p class="lead">شكراً لكِ</p><p>وصل رأيك، وسيساعدنا على تطوير رِفق.</p></div>`;
  let h = bar('قيّمي رِفق') + `<p class="muted">خمسة أسئلة قصيرة. رأيك يهمنا.</p>`;
  FQ.forEach(([q,o],i)=>{ h+=`<div class="q"><h3>${i+1}. ${q}</h3><div class="opts">`+o.map(x=>`<button aria-pressed="${FA[i]===x}" onclick="FA[${i}]='${x}';render()">${x}</button>`).join('')+`</div></div>`; });
  h += `<div class="q"><h3>5. ما الذي تودّين إضافته أو تغييره؟</h3><textarea oninput="FT=this.value" placeholder="اكتبي هنا بحرية">${esc(FT)}</textarea></div>`;

  const ready = Object.keys(FA).length===4;
  return h + cta(`<button class="btn" ${ready&&FS!=='sending'?'':'disabled'} onclick="sendFb()">${FS==='sending'?'جارٍ الإرسال…':'أرسلي التقييم'}</button>`);
}

  FS='sending'; render();
  const payload={product:'rifq',version:'J2026100208',ease:FA[0],language:FA[1],look:FA[2],useful:FA[3],comment:FT.trim(),createdAt:new Date().toISOString()};
