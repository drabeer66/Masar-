<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>المحقق الصغير — كتاب تفاعلي</title>
<style>
  :root{
    --bg1:#1b3a6b; --bg2:#2e6db4; --accent:#ffb703; --accent2:#ff7b00;
    --ink:#123; --card:#ffffff; --green:#2f9e44; --red:#e03131;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Segoe UI","Tahoma","Noto Kufi Arabic","Noto Naskh Arabic",sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--ink); min-height:100vh;
  }
  .app{max-width:760px;margin:0 auto;padding:12px 12px 60px;}
  /* header */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(27,58,107,.92);backdrop-filter:blur(6px);
    color:#fff;border-radius:0 0 18px 18px;padding:10px 14px;
    display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .topbar .logo{font-size:26px;}
  .topbar h1{font-size:clamp(17px,4.4vw,22px);margin:0;flex:1;font-weight:800;}
  .stars{display:flex;gap:2px;font-size:16px;letter-spacing:1px;}
  .star{filter:grayscale(1);opacity:.45;transition:.3s;}
  .star.on{filter:none;opacity:1;transform:scale(1.15);}
  /* cover */
  .cover{
    margin-top:14px;border-radius:22px;overflow:hidden;position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,.35);background:#fff;
  }
  .cover img{display:block;width:100%;}
  /* sections */
  .sect-title{
    color:#fff;margin:22px 4px 10px;font-size:clamp(18px,5vw,23px);font-weight:800;
    display:flex;align-items:center;gap:8px;
  }
  /* menu grid */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr);}}
  .card{
    background:var(--card);border-radius:20px;padding:16px 12px;text-align:center;
    cursor:pointer;position:relative;box-shadow:0 6px 16px rgba(0,0,0,.18);
    transition:transform .15s, box-shadow .15s;border:3px solid transparent;
    user-select:none;
  }
  .card:active{transform:scale(.96);}
  .card .emoji{font-size:40px;display:block;line-height:1;}
  .card .num{
    position:absolute;top:8px;right:10px;background:var(--accent);color:#fff;
    width:24px;height:24px;border-radius:50%;font-weight:800;font-size:13px;
    display:flex;align-items:center;justify-content:center;
  }
  .card .t{font-weight:800;font-size:clamp(14px,3.8vw,17px);margin-top:8px;color:var(--ink);}
  .card .done-badge{
    display:none;position:absolute;top:8px;left:8px;background:var(--green);color:#fff;
    border-radius:999px;font-size:12px;padding:2px 8px;font-weight:700;
  }
  .card.done{border-color:var(--green);}
  .card.done .done-badge{display:block;}
  .parent-card{background:linear-gradient(135deg,#ffd97a,#ffb703);}
  /* activity screen */
  .act{
    position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,var(--bg1),var(--bg2));
    overflow-y:auto;display:none;
  }
  .act.open{display:block;}
  .act-inner{max-width:760px;margin:0 auto;padding:12px 12px 40px;}
  .act-bar{
    display:flex;align-items:center;gap:8px;color:#fff;margin-bottom:10px;
  }
  .btn{
    border:none;cursor:pointer;border-radius:14px;font-family:inherit;
    background:var(--card);color:var(--ink);font-weight:800;font-size:15px;
    padding:10px 16px;box-shadow:0 4px 10px rgba(0,0,0,.2);display:inline-flex;
    align-items:center;gap:6px;transition:transform .12s;
  }
  .btn:active{transform:scale(.94);}
  .btn.ghost{background:rgba(255,255,255,.16);color:#fff;}
  .act-bar .title{flex:1;text-align:center;font-weight:800;font-size:clamp(16px,4.6vw,21px);}
  .instruct{
    background:rgba(255,255,255,.95);border-radius:18px;padding:12px 16px;margin-bottom:12px;
    box-shadow:0 6px 16px rgba(0,0,0,.18);border-right:6px solid var(--accent);
    font-weight:700;font-size:clamp(15px,4.2vw,18px);line-height:1.7;
  }
  .instruct .n{color:var(--accent2);}
  .board{
    position:relative;background:#fff;border-radius:20px;overflow:hidden;
    box-shadow:0 10px 26px rgba(0,0,0,.3);line-height:0;
  }
  .board img{width:100%;display:block;}
  /* markers for differences */
  .marker{
    position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;
    border-radius:50%;border:4px solid var(--accent2);background:rgba(255,183,3,.35);
    color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;
    justify-content:center;animation:pop .25s ease;pointer-events:none;
    text-shadow:0 1px 2px rgba(0,0,0,.6);
  }
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(.2);}80%{transform:translate(-50%,-50%) scale(1.2);}100%{transform:translate(-50%,-50%) scale(1);}}
  /* draw canvas */
  .draw{position:absolute;inset:0;touch-action:none;cursor:crosshair;}
  /* options */
  .opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  .opt{
    min-width:76px;padding:16px 18px;border-radius:18px;background:var(--card);
    border:4px solid #dde7f2;font-size:26px;font-weight:900;color:var(--ink);
    cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.18);transition:transform .12s;
    font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .opt .txt{font-size:15px;font-weight:800;}
  .opt:active{transform:scale(.93);}
  .opt.correct{border-color:var(--green);background:#d3f9d8;animation:pop .3s;}
  .opt.wrong{border-color:var(--red);background:#ffe3e3;animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
  /* checklist chips */
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px;}
  .chip{
    background:var(--card);border:3px solid #dde7f2;border-radius:999px;padding:10px 16px;
    font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.15);
    transition:.2s;font-family:inherit;
  }
  .chip.found{border-color:var(--green);background:#d3f9d8;text-decoration:line-through;opacity:.85;}
  /* sequence cards */
  .seq-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  .seq-card{
    background:var(--card);border-radius:18px;padding:14px;width:150px;text-align:center;
    cursor:pointer;border:4px solid #dde7f2;box-shadow:0 6px 14px rgba(0,0,0,.18);
    position:relative;transition:transform .12s;user-select:none;
  }
  .seq-card:active{transform:scale(.95);}
  .seq-card .emoji{font-size:44px;}
  .seq-card .tx{font-weight:800;font-size:15px;margin-top:6px;}
  .seq-card .order-badge{
    position:absolute;top:-12px;right:-12px;width:34px;height:34px;border-radius:50%;
    background:var(--accent2);color:#fff;font-weight:900;font-size:18px;display:none;
    align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.3);
  }
  .seq-card.placed .order-badge{display:flex;}
  .seq-card.placed{opacity:.75;pointer-events:none;}
  .seq-card.wrong{border-color:var(--red);background:#ffe3e3;animation:shake .4s;}
  /* spell */
  .slots{display:flex;gap:12px;justify-content:center;margin-top:16px;direction:rtl;}
  .slot{
    width:72px;height:72px;border-radius:16px;background:#fff;border:3px dashed #9db8d8;
    font-size:38px;font-weight:900;display:flex;align-items:center;justify-content:center;
    color:var(--ink);
  }
  .slot.filled{border-style:solid;border-color:var(--accent2);}
  .tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  .tile{
    width:56px;height:56px;border-radius:14px;background:var(--card);border:3px solid #dde7f2;
    font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.15);
    font-family:inherit;transition:transform .12s;
  }
  .tile:active{transform:scale(.9);}
  /* toast / feedback */
  .toast{
    position:fixed;left:50%;top:12%;transform:translate(-50%,-20px);z-index:300;
    background:#fff;border-radius:18px;padding:14px 24px;box-shadow:0 12px 30px rgba(0,0,0,.35);
    font-weight:900;font-size:19px;display:none;align-items:center;gap:10px;max-width:90%;
    text-align:center;animation:pop .25s ease;border:3px solid var(--accent);
  }
  .toast.show{display:flex;}
  /* confetti canvas */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:400;}
  /* hint bar under activity */
  .hintline{color:#eaf2ff;text-align:center;margin-top:12px;font-size:14px;font-weight:600;opacity:.9;}
  /* modal for solutions */
  .modal{
    position:fixed;inset:0;z-index:200;background:rgba(10,20,40,.7);display:none;
    align-items:center;justify-content:center;padding:16px;
  }
  .modal.open{display:flex;}
  .modal-box{
    background:#fff;border-radius:22px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;
    padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal-box h2{margin:0 0 12px;color:var(--bg1);}
  .sol{background:#f3f7fb;border-radius:12px;padding:10px 14px;margin:8px 0;font-weight:700;line-height:1.6;}
  .sol .q{color:var(--accent2);}
  .secret{filter:blur(6px);user-select:none;cursor:pointer;}
  .secret.revealed{filter:none;}
  .note{font-size:13px;color:#667;text-align:center;margin-top:6px;}
  .secret-ctl{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:12px;font-weight:700;font-size:14px;}
  .finish-banner{background:#fff;border-radius:22px;padding:18px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);margin-top:14px;}
  .finish-banner img{border-radius:14px;width:100%;}
</style>
</head>

/* ================= SFX (WebAudio) ================= */
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f,t,type,vol,delay){
  const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.value=f;
  const s=c.currentTime+(delay||0);
  g.gain.setValueAtTime(0.0001,s);
  g.gain.exponentialRampToValueAtTime(vol||0.2,s+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,s+t);
  o.connect(g); g.connect(c.destination); o.start(s); o.stop(s+t+0.05);
}
function sfxCorrect(){ tone(523,.15,"triangle",.18); tone(659,.15,"triangle",.18,.1); tone(784,.25,"triangle",.18,.2); }
function sfxWrong(){ tone(196,.3,"sawtooth",.12); tone(155,.35,"sawtooth",.12,.12); }
function sfxWin(){ [523,659,784,1046].forEach((f,i)=>tone(f,.22,"triangle",.2,i*.12)); tone(1318,.5,"triangle",.18,.5); }
function sfxPop(){ tone(880,.06,"sine",.1); }

/* ================= CONFetti ================= */
const confCv=document.getElementById("confetti"), cctx=confCv.getContext("2d");
let confetti=[]; let confOn=false;
function confettiSize(){ confCv.width=innerWidth; confCv.height=innerHeight; }
addEventListener("resize",confettiSize); confettiSize();
function burst(n){
  const colors=["#ffb703","#ff7b00","#2f9e44","#3aa6ff","#ff4d6d","#9b5de5"];
  for(let i=0;i<(n||120);i++){
    confetti.push({x:innerWidth/2,y:innerHeight*0.35,vx:(Math.random()-.5)*9,vy:Math.random()*-10-3,
      s:6+Math.random()*7,c:colors[i%colors.length],r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, life:1});
  }
  if(!confOn){ confOn=true; requestAnimationFrame(confLoop); }
}
function confLoop(){
  cctx.clearRect(0,0,confCv.width,confCv.height);
  confetti=confetti.filter(p=>p.life>0 && p.y<confCv.height+20);
  for(const p of confetti){
    p.vy+=0.25; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=0.008;
    cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.r);
    cctx.globalAlpha=Math.max(0,p.life); cctx.fillStyle=p.c;
    cctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); cctx.restore();
  }
  if(confetti.length){ requestAnimationFrame(confLoop); } else { confOn=false; cctx.clearRect(0,0,confCv.width,confCv.height); }
}

const toast=document.getElementById("toast"); let toastT=null;
function showToast(msg){
  toast.innerHTML=msg; toast.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>toast.classList.remove("show"),2200);
}
function rand(a){ return a[Math.floor(Math.random()*a.length)]; }

/* ================= STARS ================= */
function renderStars(){
  const el=document.getElementById("starsTop");
  let h="";
  for(let i=0;i<10;i++) h+=`<span class="star${i<doneCount()?" on":""}">⭐</span>`;
  el.innerHTML=h;
  const fb=document.getElementById("finishBanner");
  fb.style.display = doneCount()>=10 ? "block" : "none";
}

/* ================= MENU ================= */
const menu=document.getElementById("menu");
function renderMenu(){
  menu.innerHTML="";
  ACTIVITIES.forEach((a,i)=>{
    const c=document.createElement("div");
    c.className="card"+(done[a.id]?" done":"");
    c.innerHTML=`<span class="num">${i+1}</span><span class="done-badge">✓ تم</span>
      <span class="emoji">${a.emoji}</span><div class="t">${a.title}</div>`;
    c.onclick=()=>openAct(i);
    menu.appendChild(c);
  });
  renderStars();
}
renderMenu();

/* ================= ACTIVITY VIEW ================= */
const act=document.getElementById("act");
function openAct(i){
  cur=i;
  const a=ACTIVITIES[i];
  act.classList.add("open");
  document.getElementById("actTitle").textContent=`${i+1}. ${a.title}`;
  document.getElementById("actInstruct").innerHTML=a.instruct;
  document.getElementById("hintline").textContent=a.hint||"";
  const bw=document.getElementById("boardWrap");
  bw.innerHTML=`<img src="${a.img}" alt="${a.title}" id="boardImg">`;
  const inter=document.getElementById("interact"); inter.innerHTML="";
  if(a.type==="choice") renderChoice(a,inter);
  else if(a.type==="mark") renderMark(a,inter);
  else if(a.type==="checklist") renderChecklist(a,inter);
  else if(a.type==="order") renderOrder(a,inter);
  else if(a.type==="spell") renderSpell(a,inter);
  else if(a.type==="draw") renderDraw(a,bw,inter);
  act.scrollTop=0;
}
function closeAct(){ act.classList.remove("open"); renderMenu(); }
document.getElementById("actBack").onclick=closeAct;
document.getElementById("actPrev").onclick=()=>openAct((cur+ACTIVITIES.length-1)%ACTIVITIES.length);
document.getElementById("actNext").onclick=()=>openAct((cur+1)%ACTIVITIES.length);

function complete(a){
  if(done[a.id]) return;
  done[a.id]=true; save(); renderStars();
  sfxWin(); burst(160);
  showToast(`🎉 ${a.title} — أحسنت!`);
}

/* ---------- CHOICE ---------- */
function renderChoice(a,wrap){
  const d=document.createElement("div"); d.className="opts";
  a.options.forEach(o=>{
    const b=document.createElement("button"); b.className="opt"; b.dataset.v=o.label;
    b.innerHTML=`<span>${o.label}</span>`+(o.txt?`<span class="txt">${o.txt}</span>`:"");
    b.onclick=()=>{
      if(done[a.id]) return;
      if(o.label===a.answer){
        b.classList.add("correct"); sfxCorrect();
        showToast(rand(PRAISE));
        setTimeout(()=>{ showToast(`✅ ${a.reason}`); },1400);
        complete(a);
      } else {
        b.classList.add("wrong"); sfxWrong(); showToast(rand(NUDGE));
        setTimeout(()=>b.classList.remove("wrong"),450);
      }
    };
    d.appendChild(b);
  });
  if(a.options[0].txt===""){
    const note=document.createElement("div");
    note.className="note"; note.style.cssText="color:#eaf2ff;margin-top:8px;font-weight:700;";
    note.textContent="🔎 انظر إلى الرموز (أ، ب، ج) داخل الصورة لتختار";
    wrap.appendChild(note);
  }
  wrap.appendChild(d);
}

/* ---------- MARK (differences) ---------- */
function renderMark(a,wrap){
  const bw=document.getElementById("boardWrap");
  const img=bw.querySelector("img");
  let n=0;
  const counter=document.createElement("div");
  counter.className="note"; counter.style.cssText="color:#eaf2ff;text-align:center;margin-top:10px;font-weight:900;font-size:17px;";
  counter.textContent=`وجدتَ 0 من ${a.need} فروق`;
  wrap.appendChild(counter);
  const ctl=document.createElement("div");
  ctl.style.cssText="display:flex;gap:10px;justify-content:center;margin-top:10px;";
  ctl.innerHTML=`<button class="btn" id="undoMark">↩ تراجع</button><button class="btn" id="revealMark">👀 الحل</button>`;
  wrap.appendChild(ctl);
  img.style.cursor="crosshair";
  function addMark(e){
    if(done[a.id]) return;
    const r=img.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;
    if(x<0||y<0||x>100||y>100) return;
    const m=document.createElement("div"); m.className="marker"; m.textContent=++n;
    m.style.left=x+"%"; m.style.top=y+"%";
    bw.appendChild(m); sfxPop();
    counter.textContent=`وجدتَ ${n} من ${a.need} فروق`;
    if(n>=a.need){ complete(a); counter.textContent="🎉 رائع! وجدت الفروق الخمسة كلها!"; }
  }
  img.onclick=addMark;
  document.getElementById("undoMark").onclick=()=>{
    if(done[a.id]) return;
    const ms=bw.querySelectorAll(".marker");
    if(ms.length){ ms[ms.length-1].remove(); n=Math.max(0,n-1);
      counter.textContent=`وجدتَ ${n} من ${a.need} فروق`; }
  };
  document.getElementById("revealMark").onclick=()=>showToast("🕵️ "+a.reveal);
}

/* ---------- CHECKLIST ---------- */
function renderChecklist(a,wrap){
  const d=document.createElement("div"); d.className="chips";
  let found=0;
  a.items.forEach((it,i)=>{
    const c=document.createElement("button"); c.className="chip"; c.textContent=it;
    c.onclick=()=>{
      if(c.classList.contains("found")) return;
      c.classList.add("found"); found++; sfxPop();
      if(found>=a.items.length){ complete(a); }
    };
    d.appendChild(c);
  });
  wrap.appendChild(d);
}

/* ---------- ORDER ---------- */
function renderOrder(a,wrap){
  const steps=a.steps.map((s,i)=>({e:s.e,t:s.t,idx:i+1}));
  // shuffle for display
  for(let i=steps.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [steps[i],steps[j]]=[steps[j],steps[i]]; }
  const d=document.createElement("div"); d.className="seq-row";
  let next=1;
  steps.forEach(s=>{
    const c=document.createElement("div"); c.className="seq-card";
    c.innerHTML=`<div class="order-badge"></div><div class="emoji">${s.e}</div><div class="tx">${s.t}</div>`;
    c.onclick=()=>{
      if(done[a.id]||c.classList.contains("placed")) return;
      if(s.idx===next){
        c.querySelector(".order-badge").textContent=next;
        c.classList.add("placed");
        sfxCorrect();
        next++;
        if(next>steps.length){ complete(a); }
      } else {
        c.classList.add("wrong"); sfxWrong(); showToast(rand(NUDGE));
        setTimeout(()=>c.classList.remove("wrong"),450);
      }
    };
    d.appendChild(c);
  });
  wrap.appendChild(d);
  const note=document.createElement("div");
  note.className="note"; note.style.cssText="color:#eaf2ff;margin-top:8px;font-weight:700;";
  note.textContent="اضغط على الصور بالترتيب: الأول ← الثاني ← الثالث";
  wrap.appendChild(note);
}

/* ---------- SPELL ---------- */
function renderSpell(a,wrap){
  const word=a.answer.split("");
  const slots=document.createElement("div"); slots.className="slots";
  const slotEls=[];
  word.forEach(()=>{ const s=document.createElement("div"); s.className="slot"; slots.appendChild(s); slotEls.push(s); });
  const tiles=document.createElement("div"); tiles.className="tiles";
  a.tiles.forEach(t=>{
    const b=document.createElement("button"); b.className="tile"; b.textContent=t;
    b.onclick=()=>{
      if(done[a.id]) return;
      const idx=slotEls.findIndex(s=>!s.dataset.v);
      if(idx<0) return;
      slotEls[idx].textContent=t; slotEls[idx].dataset.v=t; slotEls[idx].classList.add("filled"); sfxPop();
      if(slotEls.every(s=>s.dataset.v)){
        const got=slotEls.map(s=>s.dataset.v).join("");
        if(got===a.answer){ slotEls.forEach(s=>s.style.borderColor="var(--green)"); sfxWin(); burst(120);
          showToast(rand(PRAISE)); complete(a); }
        else { sfxWrong(); showToast(rand(NUDGE)); slotEls.forEach(s=>s.style.borderColor="var(--red)");
          setTimeout(()=>{ slotEls.forEach(s=>{s.textContent="";s.dataset.v="";s.classList.remove("filled");s.style.borderColor="";}); },900); }
      }
    };
    tiles.appendChild(b);
  });
  const ctl=document.createElement("div");
  ctl.style.cssText="display:flex;gap:10px;justify-content:center;margin-top:12px;";
  ctl.innerHTML=`<button class="btn" id="spellClr">🔄 امسح</button>`;
  wrap.appendChild(slots); wrap.appendChild(tiles); wrap.appendChild(ctl);
  document.getElementById("spellClr").onclick=()=>{
    slotEls.forEach(s=>{s.textContent="";s.dataset.v="";s.classList.remove("filled");s.style.borderColor="";});
  };
}

/* ---------- DRAW (maze) ---------- */
function renderDraw(a,bw,wrap){
  const img=bw.querySelector("img");
  const cv=document.createElement("canvas"); cv.className="draw";
  bw.appendChild(cv);
  const ctx=cv.getContext("2d");
  let color="#e8590c", size=10;
  const strokes=[];
  function fit(){
    const r=img.getBoundingClientRect();
    cv.width=r.width; cv.height=r.height;
    redraw();
  }
  function redraw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.lineCap="round"; ctx.lineJoin="round";
    for(const st of strokes){
      ctx.strokeStyle=st.c; ctx.lineWidth=st.w*cv.width/1000;
      ctx.beginPath();
      st.pts.forEach((p,i)=>{ const x=p.x*cv.width, y=p.y*cv.height; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
      ctx.stroke();
    }
  }
  let curStroke=null, drawing=false;
  function pos(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height}; }
  cv.addEventListener("pointerdown",e=>{ drawing=true; try{cv.setPointerCapture(e.pointerId);}catch(_){}
    curStroke={c:color,w:size,pts:[pos(e)]}; strokes.push(curStroke); redraw(); });
  cv.addEventListener("pointermove",e=>{ if(!drawing) return;
    curStroke.pts.push(pos(e)); redraw(); });
  function up(){ drawing=false; curStroke=null; }
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
  addEventListener("resize",fit);
  const ctl=document.createElement("div");
  ctl.style.cssText="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px;align-items:center;";
  ctl.innerHTML=`
    <button class="btn" data-c="#e8590c">🟠</button>
    <button class="btn" data-c="#1971c2">🔵</button>
    <button class="btn" data-c="#2f9e44">🟢</button>
    <button class="btn" data-c="#f03e3e">🔴</button>
    <button class="btn" id="drawUndo">↩ تراجع</button>
    <button class="btn" id="drawClear">🧽 مسح</button>
    <button class="btn" id="drawAnswer">💡 الحل</button>`;
  wrap.appendChild(ctl);
  ctl.querySelectorAll("[data-c]").forEach(b=>{ b.onclick=()=>{ color=b.dataset.c; sfxPop(); }; });
  document.getElementById("drawUndo").onclick=()=>{ strokes.pop(); redraw(); };
  document.getElementById("drawClear").onclick=()=>{ strokes.length=0; redraw(); };
  document.getElementById("drawAnswer").onclick=()=>showToast("🕵️ "+a.answer);
  requestAnimationFrame(fit);
}
